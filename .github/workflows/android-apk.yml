name: Bloodborne Android ARM64 APK (starter)

on:
workflow_dispatch:
push:
branches:
- main
- android-arm64

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Install Android SDK components
    uses: android-actions/setup-android@v3
    with:
      packages: 'platforms;android-35,build-tools;35.0.0,cmake;3.22.1,ndk;27.2.12479018'

  - name: Build debug APK
    run: gradle --no-daemon assembleDebug

  - name: Verify APK
    run: |
      test -f app/build/outputs/apk/debug/app-debug.apk
      unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libbbport_android.so'

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: bloodborne-android-arm64-starter-apk
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14