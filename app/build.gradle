plugins {
id 'com.android.application'
}

android {
namespace 'org.bbport.android'
compileSdk 35

defaultConfig {
    applicationId 'org.bbport.android'
    minSdk 28
    targetSdk 35
    versionCode 1
    versionName '0.1.0-starter'

    ndk {
        abiFilters 'arm64-v8a'
    }

    externalNativeBuild {
        cmake {
            cppFlags '-std=c++20'
        }
    }
}

externalNativeBuild {
    cmake {
        path file('src/main/cpp/CMakeLists.txt')
        version '3.22.1'
    }
}

buildTypes {
    debug {
        debuggable true
    }
}

}
